<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Sanket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div th:replace="~{fragments/layout :: nav}"></div>

    <main class="container">
        <p class="eyebrow">Admin</p>
        <h1>Posts</h1>

        <div class="actions admin-top">
            <a class="btn btn-primary" th:href="@{/admin/new}">New post</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn" type="submit">Log out</button>
            </form>
        </div>

        <p class="lead" th:if="${#lists.isEmpty(posts)}">No posts yet.</p>

        <div class="card-list">
            <article class="card" th:each="post : ${posts}">
                <p class="eyebrow" th:text="${post.createdAt}">2026-01-01</p>
                <h2 th:text="${post.title}">Title</h2>
                <div class="actions">
                    <a class="btn" th:href="@{/admin/edit/{id}(id=${post.id})}">Edit</a>
                    <form th:action="@{/admin/delete/{id}(id=${post.id})}" method="post">
                        <button class="btn btn-danger" type="submit">Delete</button>
                    </form>
                </div>
            </article>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
