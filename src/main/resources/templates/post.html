<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' | Sanket'">Post | Sanket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/blog.css}">
</head>
<body>
    <div th:replace="~{fragments/layout :: nav}"></div>

    <main class="container">
        <p class="eyebrow" th:text="${post.createdAt}">2026-01-01</p>
        <h1 th:text="${post.title}">Title</h1>
        <p class="lead" th:text="${post.summary}">Summary</p>

        <div class="post-body" th:text="${post.content}">Content</div>

        <div class="actions">
            <a class="btn" th:href="@{/blog}">Back to blog</a>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
